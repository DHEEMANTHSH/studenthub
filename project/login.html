<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.container h2{
    text-align:center;
    color:#333;
    margin-bottom:8px;
}

.container p{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-box input:focus{
    border-color:#4facfe;
    outline:none;
}

.password-box{
    position:relative;
}

.password-box span{
    position:absolute;
    right:15px;
    top:13px;
    cursor:pointer;
    color:#007bff;
}

.options{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#007bff;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4facfe;
    color:#fff;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#007bff;
}

.signup{
    text-align:center;
    margin-top:20px;
}

.signup a{
    color:#007bff;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h2>Welcome Back</h2>
<p>Login to your account</p>

<form id="loginForm">

<div class="input-box">
<label>Email Address</label>
<input
type="email"
id="email"
placeholder="Enter your email"
required>
</div>

<div class="input-box">

<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter your password"
required>

<span onclick="togglePassword(this)">Show</span>

</div>

</div>

<div class="options">

<label>
<input type="checkbox">
Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">Login</button>

<div class="signup">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

</form>

</div>

<script>

// Show/Hide Password
function togglePassword(element){

    const password = document.getElementById("password");

    if(password.type === "password"){

        password.type = "text";
        element.innerHTML = "Hide";

    }else{

        password.type = "password";
        element.innerHTML = "Show";

    }

}

// Login
document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try{

        const response = await fetch("http://localhost:5000/api/auth/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email,
                password
            })

        });

        const data = await response.json();

        console.log(data);

        if(data.success){

            // Save user details
            localStorage.setItem("user", JSON.stringify(data.user));

            alert(data.message);

            // Redirect to dashboard
            window.location.href = "dashboard.html";

        }else{

            alert(data.message);

        }

    }catch(error){

        console.error(error);

        alert("Unable to connect to server.");

    }

});

</script>

</body>
</html>
