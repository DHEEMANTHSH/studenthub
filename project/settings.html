<!-- settings.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Hub - Settings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#f4f7fc;}
.navbar{height:70px;background:#3b82f6;color:white;display:flex;justify-content:space-between;align-items:center;padding:0 30px;position:fixed;width:100%;top:0;left:0;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:1000;}
.navbar h2{font-size:24px;}
.logout{background:white;color:#3b82f6;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:bold;}
.logout:hover{background:#eee;}
.sidebar{position:fixed;top:70px;left:0;width:220px;height:100%;background:#1e293b;padding-top:20px;}
.sidebar a{display:block;color:white;text-decoration:none;padding:15px 25px;transition:.3s;}
.sidebar a:hover{background:#334155;}
.main{margin-left:220px;margin-top:70px;padding:30px;}
.content-card{background:white;padding:25px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.1);max-width:600px;}
.content-card h1{color:#333;margin-bottom:20px;}
.form-group{margin-bottom:20px;}
.form-group label{display:block;margin-bottom:8px;color:#333;font-weight:bold;}
.form-group input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
.save-btn{background:#3b82f6;color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:bold;}
.save-btn:hover{background:#2563eb;}
@media(max-width:768px){.sidebar{width:180px;}.main{margin-left:180px;}}
@media(max-width:600px){.sidebar{display:none;}.main{margin-left:0;}}
</style>
</head>
<body>
<div class="navbar">
<h2>Student Hub</h2>
<button class="logout" onclick="logout()">Logout</button>
</div>
<div class="sidebar">
<a href="dashboard.html">🏠 Dashboard</a>
<a href="profile.html">👤 My Profile</a>
<a href="courses.html">📚 Enrolled Courses</a>
<a href="assignments.html">📝 Assignments</a>
<a href="grades.html">📊 Grades & Reports</a>
<a href="settings.html">⚙ Settings</a>
</div>
<div class="main">
<div class="content-card">
<h1>Account Settings</h1>
<p style="margin-bottom:20px;color:#666;">Update your account preferences and security details below.</p>
<div class="form-group">
<label>Display Name</label>
<input type="text" id="updateName" placeholder="Enter new name">
</div>
<div class="form-group">
<label>Email Address</label>
<input type="email" id="updateEmail" placeholder="Enter new email">
</div>
<div class="form-group">
<label>New Password</label>
<input type="password" id="updatePassword" placeholder="Enter new password">
</div>
<button class="save-btn" onclick="saveSettings()">Save Changes</button>
</div>
</div>
<script>
const user = JSON.parse(localStorage.getItem("user"));
if(!user){
alert("Please login first.");
window.location.href = "login.html";
}else{
document.getElementById("updateName").value = user.name || "";
document.getElementById("updateEmail").value = user.email || "";
}
function saveSettings(){
const newName = document.getElementById("updateName").value;
const newEmail = document.getElementById("updateEmail").value;
if(newName && newEmail){
user.name = newName;
user.email = newEmail;
localStorage.setItem("user", JSON.stringify(user));
alert("Settings updated successfully!");
}else{
alert("Please fill in all fields.");
}
}
function logout(){
localStorage.removeItem("user");
alert("Logged Out Successfully");
window.location.href="login.html";
}
</script>
</body>
</html>
