<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.signup-container{
    width:400px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.signup-container h2{
    text-align:center;
    margin-bottom:10px;
    color:#333;
}

.signup-container p{
    text-align:center;
    color:#777;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus{
    border-color:#4facfe;
    outline:none;
}

.password-box{
    position:relative;
}

.password-box span{
    position:absolute;
    right:15px;
    top:13px;
    cursor:pointer;
    color:#007bff;
    font-size:14px;
}

.signup-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4facfe;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.signup-btn:hover{
    background:#007bff;
}

.login-link{
    margin-top:20px;
    text-align:center;
}

.login-link a{
    color:#007bff;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="signup-container">

<h2 id="formTitle">Create Account</h2>

<p id="formSubtitle">Register your account</p>

<form id="signupForm">

<div id="step1Fields">
<div class="input-group">
<label>Full Name</label>
<input
type="text"
id="name"
placeholder="Enter your full name"
required>
</div>

<div class="input-group">
<label>Email</label>
<input
type="email"
id="email"
placeholder="Enter your email"
required>
</div>

<div class="input-group">
<label>Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Create Password"
required>

<span onclick="togglePassword()">Show</span>

</div>

</div>

<div class="input-group">
<label>Confirm Password</label>
<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>
</div>
</div>

<div id="step2Fields" style="display:none;">
<div class="input-group">
<label>Age</label>
<input
type="number"
id="age"
placeholder="Enter your age">
</div>

<div class="input-group">
<label>College</label>
<input
type="text"
id="college"
placeholder="Enter your college name">
</div>

<div class="input-group">
<label>Skills</label>
<input
type="text"
id="skills"
placeholder="e.g. JavaScript, Python, React">
</div>
</div>

<button type="submit" class="signup-btn" id="submitBtn">
Create Account
</button>

<div class="login-link" id="loginLinkContainer">
Already have an account?
<a href="login.html">Login</a>
</div>

</form>

</div>

<script>
let currentStep = 1;
let savedName = "";
let savedEmail = "";
let savedPassword = "";

function togglePassword(){
    const password=document.getElementById("password");
    const btn=document.querySelector(".password-box span");

    if(password.type==="password"){
        password.type="text";
        btn.innerHTML="Hide";
    }else{
        password.type="password";
        btn.innerHTML="Show";
    }
}

document.getElementById("signupForm").addEventListener("submit",async function(e){
    e.preventDefault();

    if(currentStep === 1) {
        const name=document.getElementById("name").value.trim();
        const email=document.getElementById("email").value.trim();
        const password=document.getElementById("password").value;
        const confirmPassword=document.getElementById("confirmPassword").value;

        if(password!==confirmPassword){
            alert("Passwords do not match");
            return;
        }

        savedName = name;
        savedEmail = email;
        savedPassword = password;

        // Switch view to step 2
        document.getElementById("step1Fields").style.display = "none";
        document.getElementById("step2Fields").style.display = "block";
        document.getElementById("formTitle").innerText = "Additional Details";
        document.getElementById("formSubtitle").innerText = "Tell us a bit more about yourself";
        document.getElementById("submitBtn").innerText = "Complete Registration";
        document.getElementById("loginLinkContainer").style.display = "none";
        currentStep = 2;
        return;
    }

    // Step 2 Submission (Age, College, Skills)
    const age = document.getElementById("age").value.trim();
    const college = document.getElementById("college").value.trim();
    const skills = document.getElementById("skills").value.trim();

    try{
        const response=await fetch("https://studenthub-4-7gyg.onrender.com/api/auth/signup",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                name: savedName,
                email: savedEmail,
                password: savedPassword,
                age: age ? Number(age) : null,
                college: college,
                skills: skills
            })
        });

        const data=await response.json();

        if(response.ok){
            alert(data.message || "Signup Successful!");
            window.location.href="login.html";
        }else{
            alert(data.message || "Signup Failed");
        }

    }catch(error){
        console.error(error);
        alert("Unable to connect to server.");
    }
});
</script>

</body>
</html>
